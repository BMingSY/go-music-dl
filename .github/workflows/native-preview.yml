name: Native preview

on:
  pull_request:
    branches: [custom]
    paths: ['native/**', '.github/workflows/native-preview.yml', 'AGENTS.md']
  push:
    branches: [custom]
    paths: ['native/**', '.github/workflows/native-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows/amd64
            artifact: windows-amd64
          - runner: macos-15
            target: darwin/arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            target: darwin/amd64
            artifact: macos-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - name: Verify native code and playback
        env:
          MUSIC_DL_REQUIRE_AUDIO_TESTS: '1'
        run: |
          go vet ./...
          go test -race -timeout=180s ./...
      - name: Build native desktop package
        env:
          CGO_ENABLED: '0'
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.4 build -platform '${{ matrix.target }}'
      - name: Render native views
        env:
          MUSIC_DL_PREVIEW_DIR: artifacts/render
        run: go test -run TestRenderPreview -count=1 .
      - name: Real native-window smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/smoke
          export MUSIC_DL_NATIVE_CONFIG="$RUNNER_TEMP/musicdl-smoke/settings.json"
          app_binary=$(find dist -path '*.app/Contents/MacOS/*' -type f | head -1)
          test -n "$app_binary"
          "$app_binary" --smoke-test "$PWD/artifacts/smoke"
          test -f artifacts/smoke/result.txt
      - name: Upload preview and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-preview-${{ matrix.artifact }}
          path: |
            native/dist/
            native/artifacts/
          if-no-files-found: warn
          retention-days: 14

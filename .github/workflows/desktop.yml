name: CI

on:
  pull_request:
    branches: [custom]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

  test:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MUSIC_DL_REQUIRE_AUDIO_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Cache macOS FFmpeg
        if: runner.os == 'macOS'
        id: macos-media
        uses: actions/cache@v4
        with:
          path: resources/${{ matrix.target }}/
          key: ci-media-${{ matrix.target }}-${{ hashFiles('tools/bundle-ffmpeg/main.go') }}
      - name: Build FFmpeg on macOS
        if: runner.os == 'macOS' && steps.macos-media.outputs.cache-hit != 'true'
        env:
          MEDIA_TARGET: ${{ matrix.target }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install cmake ninja meson pkg-config
          go run ./tools/bundle-ffmpeg -platform "$MEDIA_TARGET"
      - name: Use bundled FFmpeg on macOS
        if: runner.os == 'macOS'
        env:
          MEDIA_TARGET: ${{ matrix.target }}
        run: printf '%s\n' "$PWD/resources/$MEDIA_TARGET" >> "$GITHUB_PATH"
      - name: Verify native architecture and media tools
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(go env GOOS)-$(go env GOARCH)" = "$EXPECTED_TARGET"
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          for name in ('ffmpeg', 'ffprobe'):
              path = shutil.which(name)
              if path is None:
                  raise SystemExit(f'{name} is required for CI')
              subprocess.run([path, '-version'], check=True)
              if name == 'ffmpeg':
                  for option, required in (('-filters', 'subtitles'),
                                           ('-encoders', 'h264_mf' if os.name == 'nt' else 'h264_videotoolbox')):
                      result = subprocess.run([path, '-hide_banner', option], check=True,
                                              capture_output=True, text=True)
                      available = {fields[1] for line in result.stdout.splitlines()
                                   if len(fields := line.split()) >= 2}
                      if required not in available:
                          raise SystemExit(f'FFmpeg {required} support is required for CI')
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                      env.write(f'MUSIC_DL_TEST_FFMPEG={path}\n')
          PY
      - name: Go vet
        run: go vet ./...
      - name: Race tests with FFmpeg
        run: go test -race -count=1 -timeout=180s ./...
      - name: Update installation smoke
        run: go run ./tools/test-update
      - name: Render desktop UI
        env:
          MUSIC_DL_PREVIEW_DIR: ${{ github.workspace }}/artifacts/render
        run: |
          go test -run TestRenderPreview -count=1 ./internal/desktop
          test -s artifacts/render/main.png
          test -s artifacts/render/mini.png
      - name: Native window smoke
        run: |
          mkdir -p artifacts/smoke
          binary="$PWD/artifacts/music-dl"
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary+='.exe'
          fi
          go build -o "$binary" ./cmd/music-dl
          "$binary" --smoke-test "$PWD/artifacts/smoke"
          test -s artifacts/smoke/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

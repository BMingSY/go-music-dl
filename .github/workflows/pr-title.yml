name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a Conventional Commits prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'JS'
          const title = process.env.PR_TITLE || '';
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/u;
          if (!pattern.test(title)) {
            console.error('::error::PR titles must use <type>[optional scope][!]: <summary>, e.g. feat: add a feature, fix(playback): handle early EOF, or ci: update tests.');
            process.exit(1);
          }
          JS
